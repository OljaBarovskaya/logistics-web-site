<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transit flow</title>
</head>
<body>
  <header class="header">
    <div class="header-information" >
      <div class="logo">
        <a href="#" class="logo-image"></a>
        <span>TransitFlow</span>
      </div>
      <div class="address">
        <div class="layout-3-column">
          <div class="address-block address-block_time">
            <icon></icon>
            <div class="adress-block__information">
              <p>Mon - Sat 9.00 - 18.00</p>
              <p>Sunday Closed</p>
            </div>
          </div>
          <div class="address-block address-block_email">
            <icon></icon>
            <div class="adress-block__information">
              <p>Email</p>
              <p>contact@logistics.com</p>
            </div>
          </div>
          <div class="address-block address-block_call">
            <icon></icon>
            <div class="adress-block__information">
              <p>Call Us</p>
              <p>(00) 112 365 489</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="menu">
      <nav class="menu__navigation">
        <ul class="navigation">
          <li>Home</li>
          <li>About</li>
          <li>Pages</li>
          <li>Project</li>
          <li>Contacts</li>
        </ul>
      </nav>
      <div class="menu__contact-possibility">
        <div class="social-net-information">
          <ul class="follow-us">
            <li class="instagram"></li>
            <li class="facebook"></li>
            <li class="twitter"></li>
            <li class="linkedin"></li>
          </ul>
        </div>
        <button class="request-quote"></button>
      </div>
    </div>
  </header>
</body>
</html>
